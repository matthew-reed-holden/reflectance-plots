{% extends base %}

{% block preamble %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        {% include 'custom.min.css' %}

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .top-nav {
            background-color: #500000;
            color: #fff;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .top-nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .top-nav a:hover { opacity: 0.8; }
        .top-nav img { height: 50px; }
        .nav-links { display: flex; align-items: center; gap: 16px; }

        .page-container {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 20px 0;
            color: #333;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            padding: 16px;
            margin-bottom: 20px;
        }

        .plot-row {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }
        .plot-row.full { grid-template-columns: 1fr; }
        .plot-row.half { grid-template-columns: 1fr 1fr; }

        @media (max-width: 800px) {
            .plot-row.half { grid-template-columns: 1fr; }
        }

        .plot-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            padding: 12px;
            overflow: hidden;
        }

        .scrollable { overflow: auto; }
    </style>
{% endblock %}

{% block contents %}
<body>
    <nav class="top-nav">
        <a href="https://tamu.edu">
            <img src="reflectance-plots/static/TAM-PrimaryMarkB-white.png" alt="Texas A&M">
        </a>
        <div class="nav-links">
            <a href="https://instrumentation.tamu.edu/">Lab Home</a>
            <a href="https://github.com/matthewholden01/reflectance-plots">GitHub</a>
        </div>
    </nav>

    <div class="page-container">
        <h1 class="page-title">Black & White Materials Reflectance Data</h1>

        <div class="card">
            {{ embed(roots.tabs) }}
        </div>

        <div class="plot-row full">
            <div class="plot-card">{{ embed(roots.total) }}</div>
        </div>

        <div class="plot-row full">
            <div class="plot-card">{{ embed(roots.spec) }}</div>
        </div>

        <div class="plot-row half">
            <div class="plot-card">{{ embed(roots.lamb) }}</div>
            <div class="plot-card">{{ embed(roots.resid) }}</div>
        </div>
    </div>
</body>
{% endblock %}
